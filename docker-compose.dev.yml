services:
  postgres:
    image: postgres:16-alpine
    container_name: autoapply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: job_hunter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - autoapply-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: autoapply-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "56379:6379"
    volumes:
      - autoapply-redis-data:/data

volumes:
  autoapply-postgres-data:
  autoapply-redis-data:
